<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在线输入文本并导出 Markdown 文件" />
  <title>Text to MD</title>
  <link rel="stylesheet" href="web.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="logo" href="./"><span>↗</span> Text to MD</a>
      <p>无需安装，浏览器本地导出 Markdown</p>
    </header>
    <section class="hero">
      <p class="eyebrow">TEXT → MARKDOWN</p>
      <h1>写下内容，带走 <em>.md</em></h1>
      <p>支持直接输入或导入 TXT / Markdown。内容不会上传到服务器。</p>
    </section>
    <section class="editor-card" aria-label="Markdown 编辑器">
      <div class="editor-toolbar">
        <span id="file-label">未命名文本</span>
        <div><input id="file-input" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden /><button id="import" class="secondary" type="button">导入文件</button><button id="download" type="button">下载 .md</button></div>
      </div>
      <textarea id="content" placeholder="在这里输入或粘贴你的文本…" autofocus></textarea>
      <div class="editor-footer"><span id="count">0 字符</span><span>⌘ / Ctrl + Enter 可下载</span></div>
    </section>
    <section class="tips"><div><b>01</b><h2>输入文本</h2><p>直接写作、粘贴内容，或导入已有文本文件。</p></div><div><b>02</b><h2>编辑 Markdown</h2><p>按 Markdown 语法加入标题、列表或链接。</p></div><div><b>03</b><h2>立即下载</h2><p>点击按钮，浏览器将生成 `.md` 文件。</p></div></section>
  </main>
  <script src="web.js"></script>
</body>
</html>
