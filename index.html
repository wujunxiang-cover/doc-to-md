<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="在浏览器本地完成自动排版、预览与多格式导出。"><title>Text to MD · 本地文档排版</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%233f7465'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='28' fill='white'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="web.css"><link rel="stylesheet" href="layout.css"></head><body>
<main class="app-shell"><header class="app-header"><a class="brand" href="./"><span class="brand-icon">✳</span>Text to MD <small>STUDIO</small></a><div class="header-actions"><span class="privacy"><i></i>本地处理</span><button id="open-preview" class="secondary">预览文档</button><button id="export-menu" class="primary">导出</button></div></header>
<section class="workspace"><section id="editor-pane" class="pane editor-pane"><div class="pane-title"><div><span>开始排版</span><small>粘贴内容或 Markdown，预览后可直接修改</small></div><div class="editor-tools"><label class="import-button"><input id="file-input" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden>导入 TXT / MD</label></div></div><textarea id="content" spellcheck="false" placeholder="在这里输入或粘贴文字…&#10;&#10;示例：&#10;一、项目简介&#10;这是正文内容。&#10;&#10;- 第一项&#10;- 第二项"></textarea><div class="editor-actions"><span>内容在本机处理并自动保存</span><button id="clear-local" class="quiet-button">清空文本</button></div></section></section>
<section id="preview-pane" class="preview-pane" aria-label="可编辑文档预览"><div class="preview-topbar"><div><strong>文档预览与修改</strong><span>可直接点击文字进行编辑</span></div><div class="preview-controls"><div class="preview-switch"><button class="active" data-page-mode="continuous">连续</button><button data-page-mode="page">页面</button></div><button id="close-preview" class="close-preview">完成 / 返回输入 ×</button></div></div><div class="format-toolbar"><button id="undo" title="撤销">↶</button><button id="redo" title="重做">↷</button><span></span><button data-command="bold" title="加粗"><b>B</b></button><button data-command="italic" title="斜体"><i>I</i></button><button data-command="strikeThrough" title="删除线"><s>S</s></button><span></span><button data-block="h1">H1</button><button data-block="h2">H2</button><button data-block="h3">H3</button><button data-block="p">正文</button><span></span><button data-command="insertUnorderedList" title="无序列表">☷</button><button data-command="insertOrderedList" title="有序列表">☷₁</button><button data-block="blockquote" title="引用">❝</button><button data-block="pre" title="代码块">&lt;/&gt;</button><button data-divider title="分隔线">—</button><span></span><button data-command="justifyLeft" title="左对齐">⇤</button><button data-command="justifyCenter" title="居中对齐">↔</button></div><div id="page-stage" class="page-stage continuous"><article id="preview" class="document theme-clean" contenteditable="true"><p class="empty-preview">还没有内容，先在输入区添加一些文字。</p></article></div></section>
<footer class="statusbar"><span id="status">准备就绪</span><span id="count">0 字符</span><span id="page-info">草稿保存在浏览器</span></footer></main>
<aside id="settings-panel" class="settings-panel" hidden><div class="panel-header"><h2 id="panel-title">排版设置</h2><button id="close-panel" class="icon-button">×</button></div><div id="panel-content"></div></aside><dialog id="export-dialog" class="export-dialog"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button><h2>导出文档</h2><p>选择文件格式与名称，导出后仍可继续编辑。</p><label>文件格式<select id="export-format"><option value="docx">Word 文档 (.docx)</option><option value="md">Markdown (.md)</option><option value="pdf">PDF 文档 (.pdf)</option><option value="png">分页图片包 (.zip)</option></select></label><label>文件名称<input id="export-name" value="自动排版" maxlength="80"></label><div class="save-location"><div><b>保存位置</b><span id="save-location-label">浏览器默认下载位置</span></div><button type="button" id="choose-folder">选择文件夹</button></div><small id="folder-support">未选择文件夹时，将使用浏览器默认下载位置。</small><menu><button value="cancel" class="quiet-button">取消</button><button id="confirm-export" value="default" class="primary">开始导出</button></menu></form></dialog><div id="toast" class="toast" role="status" hidden></div><noscript><p class="script-warning">请启用 JavaScript 才能使用排版与导出功能。</p></noscript><script defer src="app.bundle.js" onerror="document.getElementById('status').textContent='功能脚本未能加载，请刷新页面。'"></script></body></html>
